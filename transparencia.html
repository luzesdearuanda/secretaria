<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Portal da Transparência · Luzes de Aruanda</title>
  <meta name="theme-color" content="#1C3557">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="publico.css">
  <script src="config.js"></script>
  <script src="cartao.js"></script>
  <style>
    /* versão 2.2: Portal da Transparência completo. Só leitura: nada é baixado nem impresso. */
    body{background:var(--bg)}
    .tp{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
    .tp-top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .tp-top img.logo{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:contain}
    .tp-top .tit b{display:block;font-size:1.05rem;color:var(--sea)}.tp-top .tit span{font-size:.78rem;color:var(--muted)}
    .tp-quem{margin-left:auto;display:flex;align-items:center;gap:10px;text-align:right}.tp-quem img,.tp-quem .sem{width:38px;height:46px;border-radius:6px;object-fit:cover;border:2px solid var(--brand);background:var(--bg)}
    .tp-quem b{display:block;font-size:.9rem}.tp-quem span{font-size:.75rem;color:var(--muted)}
    .tp-corpo{display:grid;grid-template-columns:210px 1fr;min-height:0}
    .tp-side{background:var(--sea);color:#dfe7f1;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
    .tp-side .sec{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;padding:4px 10px 8px}
    .tp-nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:inherit;font:inherit;padding:10px;border-radius:9px;cursor:pointer;text-align:left}
    .tp-nav svg{width:20px;height:20px}.tp-nav[aria-current=page]{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 #E0A526}
    .tp-main{padding:20px 22px 90px;display:grid;gap:14px;align-content:start;max-width:1120px;width:100%}
    .tp-main h1{margin:0;font-size:1.5rem;color:var(--sea)}.tp-sub{margin:-8px 0 0;color:var(--muted);font-size:.9rem}
    .tp-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
    .tp-card h2{margin:0;font-size:1.02rem}
    .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
    .k{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px}
    .k span{display:block;font-size:.8rem;color:var(--muted)}.k b{font-size:1.25rem}.k.neg{border-left-color:#C98A1D}.k.sea{border-left-color:var(--sea)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .selo{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-weight:700;font-size:.8rem}
    .selo.ok{background:var(--ok-soft);color:var(--ok)}.selo.warn{background:var(--warn-soft);color:var(--warn)}.selo.bad{background:var(--bad-soft);color:var(--bad)}
    .sit{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}.sit dt{font-size:.78rem;color:var(--muted)}.sit dd{margin:0;font-weight:600}
    .lin{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lin:last-child{border-bottom:0}.lin .s{font-size:.8rem;color:var(--muted)}
    .per{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.per button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:7px 14px;font:inherit;cursor:pointer}
    .per button[aria-pressed=true]{background:var(--sea);color:#fff;border-color:var(--sea)}.per input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:var(--surface);color:var(--fg)}
    table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.75rem;color:var(--muted);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}
    .bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px;overflow-x:auto}.bars .m{display:grid;justify-items:center;gap:4px;min-width:34px;flex:1}
    .bars .par{display:flex;align-items:flex-end;gap:3px;height:120px}.bars .par i{display:block;width:11px;border-radius:3px 3px 0 0;background:var(--brand)}.bars .par i.s{background:#C98A1D}.bars small{font-size:.7rem;color:var(--muted)}
    .leg{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin-right:4px}.leg i.s{background:#C98A1D}
    .cat{display:grid;gap:3px;padding:5px 0}.cat div{display:flex;justify-content:space-between;font-size:.88rem}.cat span.b{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.cat span.b i{display:block;height:100%;background:var(--brand)}.cat.s span.b i{background:#C98A1D}
    .nota{font-size:.8rem;color:var(--muted)}
    .tp-pe{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
    button.tp-quem{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:4px;border-radius:10px}button.tp-quem:hover{background:var(--bg)}
    .selo.neu{background:var(--bg);color:var(--muted);border:1px solid var(--line)}.selo.sea{background:#DDE6F1;color:var(--sea)}
    .mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mc{border-radius:10px;padding:10px 6px;display:grid;justify-items:center;gap:2px;border:1px solid var(--line);text-align:center}.mc b{text-transform:capitalize}.mc span{font-size:.75rem;font-weight:600}.mc small{font-size:.7rem;color:var(--muted)}
    .mc.ok{background:var(--ok-soft);color:var(--ok)}.mc.bad{background:var(--bad-soft);color:var(--bad)}.mc.sea{background:#DDE6F1;color:var(--sea)}.mc.neu{background:var(--surface);color:var(--muted)}.mc.nd{opacity:.45}
    .leg i.ok{background:var(--ok)}.leg i.bad{background:var(--bad)}.leg i.neu{background:var(--line)}.leg i.sea{background:var(--sea)}.leg{flex-wrap:wrap}
    .lin.ev{justify-content:flex-start;align-items:flex-start}.lin.ev .dt{display:grid;justify-items:center;min-width:44px;border-radius:8px;background:var(--bg);padding:4px}.lin.ev .dt b{font-size:1.1rem}.lin.ev .dt small{font-size:.7rem;color:var(--muted);text-transform:uppercase}
    .calh{display:flex;justify-content:space-between;align-items:center}.calh .btn{padding:4px 14px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--muted);font-size:.72rem}
    .cd{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;min-height:42px;font:inherit;display:grid;justify-items:center;align-content:center;gap:2px}.cd:disabled{opacity:.6}.cd.tem{border-color:var(--brand);cursor:pointer;font-weight:700}.cd.hj{outline:2px solid var(--sea)}.cd i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
    details.tp-card summary{cursor:pointer}
    .dgrid{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:14px;align-items:start}.dlist{gap:4px}.dl{display:flex;gap:10px;align-items:center;border:1px solid transparent;background:none;color:inherit;font:inherit;text-align:left;padding:8px;border-radius:10px;cursor:pointer}.dl svg{width:22px;height:22px;flex:none;color:var(--sea)}.dl small{display:block;color:var(--muted);font-size:.78rem}.dl.on,.dl:hover{background:var(--bg);border-color:var(--line)}
    .dv{min-height:300px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}.dvh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--surface);padding:4px 0;z-index:1}.dvh .btn{padding:5px 12px}
    #dv-pags{display:grid;gap:10px}.pgc{width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;-webkit-user-select:none;user-select:none;pointer-events:none}
    .dv.cheio{position:fixed;inset:0;z-index:20;max-height:none;border-radius:0;top:0}
    .fbt{display:flex;flex-wrap:wrap;gap:8px}.fbt .btn svg{width:18px;height:18px}
    #f-sol label{display:grid;gap:4px}#f-sol select,#f-sol textarea,#f-sol input,#m-ano{border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;background:var(--surface);color:var(--fg)}
    .cgrid{display:grid;grid-template-columns:minmax(280px,1fr) 1.2fr;gap:14px;align-items:start}.ficha dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}.ficha dt{font-size:.75rem;color:var(--muted)}.ficha dd{margin:0;font-weight:600;overflow-wrap:anywhere}
    .faces .selos{display:flex;flex-wrap:wrap;gap:6px}.so-m{display:none!important}
    .ov-f{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end}.sheet{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:grid;gap:4px}
    .sheet button[data-pm]{display:flex;gap:12px;align-items:center;border:0;background:none;color:var(--fg);font:inherit;padding:12px;border-radius:10px;text-align:left}.sheet svg{width:22px;height:22px;color:var(--sea)}
    .tp-bottom{display:none}
    .entrada{max-width:520px;margin:30px auto;padding:0 16px;display:grid;gap:14px}
    .entrada input[type=date]{border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--surface);color:var(--fg);width:100%}
    .aviso{display:grid;gap:8px;justify-items:center;text-align:center;padding:26px 18px}.aviso svg{width:48px;height:48px}
    .cards-m{display:none}
    @media (max-width:860px){
      .tp-corpo{grid-template-columns:1fr}.tp-side{display:none}.grid2{grid-template-columns:1fr}.tp-main{padding:14px 14px 90px}
      .tp-quem div{display:none}
      .tp-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
      .tp-bottom button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;font:inherit;font-size:.72rem;padding:4px 16px}.tp-bottom svg{width:22px;height:22px}.tp-bottom [aria-current=page]{color:var(--sea);font-weight:700}
      .tabela-w{display:none}.cards-m{display:grid;gap:8px}.cm{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px}
      .mgrid{grid-template-columns:repeat(4,1fr)}.dgrid,.cgrid{grid-template-columns:1fr}.dv{position:static;max-height:none}.dv:not(.cheio){display:none}.ficha dl{grid-template-columns:1fr}
      .so-m{display:flex!important}.cgrid.t-cart .ficha,.cgrid.t-ficha>section:first-child{display:none}.faces .vs{display:none}.faces.verso .vs{display:block}.faces.verso .fr{display:none}
    }
    @media print{body *{display:none!important}body::after{content:"A impressão não está disponível no Portal da Transparência.";display:block;padding:40px;font:18px sans-serif}}
  </style>
</head>
<body>
<div id="app"><div class="spinner" role="status" aria-label="Carregando"></div></div>
<script>
'use strict';
(function () {
  const CFG = window.ASSOCIADOS_CONFIG || {}, app = document.getElementById('app'), $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtD = iso => { if (!iso) return '—'; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
  const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'], MESL = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const fmtComp = c => { const [y, m] = String(c).split('-'); return `${MESL[+m - 1]}/${y}`; };
  const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const dias = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(hoje() + 'T12:00:00')) / 864e5);
  const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const IC = { casa: sv('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'), fin: sv('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>'),
    no: sv('<circle cx="12" cy="12" r="9.5"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>'), cad: sv('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 16.5c.8-1.8 2-2.6 3.5-2.6s2.7.8 3.5 2.6M14 10h4M14 13.5h4"/>'),
    conta: sv('<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h3"/>'), mens: sv('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2 2 4-4"/>'),
    cal: sv('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="8" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>'), doc: sv('<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>'),
    sol: sv('<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>'), mais: sv('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'), tool: sv('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>') };
  const ses = { get() { try { const x = JSON.parse(sessionStorage.getItem('trSes') || 'null'); return x && x.exp > Date.now() ? x : null; } catch (e) { return null; } }, set(t, c) { try { sessionStorage.setItem('trSes', JSON.stringify({ t, c, exp: Date.now() + 4 * 3600e3 })); } catch (e) { } }, sair() { try { sessionStorage.removeItem('trSes'); } catch (e) { } } };
  async function api(action, payload) {
    let r; try { r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ action, payload }) }); } catch (e) { throw Object.assign(new Error('Sem conexão. Confira a internet e tente de novo.'), { code: 'NET' }); }
    const j = await r.json().catch(() => ({ ok: false, error: { code: 'NET', message: 'Resposta inválida do servidor. Tente de novo.' } }));
    if (!j.ok) throw Object.assign(new Error(j.error.message), { code: j.error.code }); return j.data.result;
  }
  const topo = (quem) => `<header class="tp-top"><img class="logo" src="logo.png" alt=""><div class="tit"><b>Portal da Transparência</b><span>${esc(ST.assoc || 'Associação Centro de Umbanda Luzes de Aruanda')}</span></div>${quem || ''}</header>`;
  const AV = { LINK: ['bad', 'Link inválido ou carteirinha substituída'], INATIVO: ['warn', 'Associado não ativo'], VENCIDA: ['bad', 'Carteirinha não válida para este acesso'], DESLIGADO: ['warn', 'Portal ainda não disponível'], NET: ['warn', 'Sem internet'], SEM: ['warn', 'Acesse pela sua carteirinha'], MANUT: ['warn', 'Portal em manutenção'] };
  function aviso(code, msg) { const [cls, tit] = AV[code] || ['bad', 'Não foi possível abrir']; app.innerHTML = `<div class="tp">${topo()}<div class="entrada"><div class="tp-card aviso"><span class="selo ${cls}">${cls === 'bad' ? 'Acesso bloqueado' : 'Aviso'}</span><span style="color:var(--${cls === 'bad' ? 'bad' : 'warn'})">${IC.no}</span><h2>${esc(tit)}</h2><p>${esc(msg)}</p>${code === 'NET' ? '<button class="btn primary" id="de-novo">Tentar de novo</button>' : ''}</div></div></div>`; const b = $('#de-novo'); if (b) b.onclick = iniciar; }
  // Tela 0: QR Code → confirma a data de nascimento
  async function entradaQR(codigo) {
    app.innerHTML = `<div class="tp">${topo()}<div class="entrada"><div class="spinner"></div></div></div>`;
    let v; try { v = await api('publico.validar', { codigo }); } catch (e) { return aviso(e.code === 'NET' ? 'NET' : 'LINK', e.message); }
    ST.assoc = v.assocNome || ''; if (!v.encontrada || !v.valida) return aviso('VENCIDA', v.motivo || 'Carteirinha não está válida para este acesso.');
    if (!v.transparencia) return aviso('DESLIGADO', 'O Portal da Transparência ainda não está disponível.');
    app.innerHTML = `<div class="tp">${topo()}<div class="entrada"><div class="tp-card"><span class="selo ok">Carteirinha válida</span><div style="display:flex;gap:12px;align-items:center">${v.foto ? `<img src="data:image/jpeg;base64,${v.foto}" alt="" style="width:56px;height:68px;border-radius:6px;object-fit:cover">` : ''}<div><b>${esc(v.nome)}</b><div class="small muted">Matrícula ${String(v.matricula).padStart(4, '0')}</div></div></div></div>
      <form class="tp-card" id="f-nasc"><h2>Confirme que é você</h2><p class="small muted" style="margin:0">Informe sua data de nascimento para liberar o acesso.</p><label class="small" for="nasc">Data de nascimento</label><input type="date" id="nasc" required max="${hoje()}">
        <p class="small" id="nasc-msg" style="margin:0;color:var(--bad)" role="alert"></p><div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn primary">Entrar</button><a class="btn" href="validar.html?c=${encodeURIComponent(codigo)}">Cancelar</a></div><p class="small muted" style="margin:0">Acesso só para associados ativos.</p></form></div></div>`;
    $('#f-nasc').onsubmit = async ev => { ev.preventDefault(); const m = $('#nasc-msg'); m.textContent = ''; try { const r = await api('publico.transpEntrar', { codigo, nascimento: $('#nasc').value }); ses.set(r.token, codigo); history.replaceState(null, '', 'transparencia.html'); carregar(); } catch (e) { if (['DATA', 'BLOQUEADO', 'NET'].includes(e.code)) m.textContent = e.message; else aviso(e.code, e.message); } };
  }
  const ST = { pg: '', d: null, assoc: '', ano: 0, ctab: 'prox', agv: 'lista', calM: '', dtipo: 'Todos', doc: null, docs: {}, form: null, msg: '', cart: null, ctab2: 'cart', verso: false, vis: {} };
  async function carregar() {
    const s = ses.get(); if (!s) { const c = (ses.ultimo || ''); return c ? entradaQR(c) : aviso('SEM', 'Abra o Portal da Transparência pelo link pessoal ou pelo QR Code da sua carteirinha.'); }
    const novo = !ST.d; if (novo) app.innerHTML = `<div class="tp">${topo()}<div class="entrada"><div class="spinner"></div></div></div>`;
    try { ST.d = await api('publico.transparencia', { token: s.t, ano: ST.ano || undefined, so: novo ? undefined : 1 }); ST.assoc = ST.d.assoc.nome; if (!ST.pg || !PG[ST.pg] || !visivel(ST.pg)) ST.pg = PAGS.find(p => visivel(p[0]))?.[0] || 'cadastro'; render(); }
    catch (e) { if (e.code === 'LINK' || e.code === 'INATIVO' || e.code === 'VENCIDA') ses.sair(); aviso(e.code, e.message); }
  }
  const PAGS = [['inicio', 'Início', IC.casa], ['mens', 'Mensalidades', IC.mens], ['agenda', 'Agenda', IC.cal], ['docs', 'Documentos', IC.doc], ['solic', 'Solicitações', IC.sol]];
  const estado = k => ((ST.d.secoes || {})[k] || { estado: 'ativo' }).estado, visivel = k => estado(k) !== 'oculto';
  const PG = { inicio: () => inicio(), mens: () => mens(), agenda: () => agenda(), docs: () => docs(), solic: () => solic(), cadastro: () => cadastro() };
  const TIT = { inicio: 'Início', mens: 'Mensalidades', agenda: 'Agenda', docs: 'Documentos', solic: 'Solicitações', cadastro: 'Meu cadastro' };
  function ir(pg) { ST.pg = pg; ST.doc = null; ST.form = pg === 'solic' ? ST.form : null; render(); scrollTo(0, 0); const s = ses.get(); if (s && !ST.vis[pg] && estado(pg) === 'ativo') { ST.vis[pg] = 1; api('publico.transpVisita', { token: s.t, secao: pg }).catch(() => { }); } }
  function render() {

  function cadastro() {
    const c = ST.d.cadastro, dd = (t, v) => `<div><dt>${t}</dt><dd>${v || '—'}</dd></div>`;
    const ficha = `<section class="tp-card ficha"><h2>Minha ficha</h2><dl>${dd('Nome', esc(c.nome))}${c.nomeSocial ? dd('Nome social', esc(c.nomeSocial)) : ''}${dd('Matrícula', String(c.matricula).padStart(4, '0'))}${dd('Nascimento', fmtD(c.nascimento))}${dd('Ingresso', fmtD(c.ingresso))}${dd('Categoria', esc(c.categoria))}
      ${dd('Funções e cargos', c.funcoes.length ? c.funcoes.map(f => esc(f.nome) + (f.tipo ? ` <small class="muted">(${esc(f.tipo)})</small>` : '')).join('<br>') : '')}${dd('CPF', esc(c.cpf))}${dd('RG', esc(c.rg))}${dd('E-mail', esc(c.email))}${dd('Telefone', esc(c.telefone))}${dd('Endereço', esc(c.endereco))}
      ${c.responsavel ? dd('Responsável', esc(c.responsavel.nome) + (c.responsavel.parentesco ? ` (${esc(c.responsavel.parentesco)})` : '')) : ''}</dl>
      <h2>Documentos entregues</h2>${c.docs.map(x => `<div class="lin"><span>${esc(x.tipo)}</span><span class="selo ${x.st === 'Entregue' ? 'ok' : x.st === 'Pendente' ? 'bad' : 'warn'}">${x.st}</span></div>`).join('')}
      ${visivel('solic') ? '<button class="btn" id="c-alt">Encontrou algum dado errado? Solicitar alteração</button>' : ''}</section>`;
    const cart = `<section class="tp-card"><h2>Carteirinha</h2><div id="c-cart" class="faces${ST.verso ? ' verso' : ''}"><div class="spinner"></div></div><button class="btn so-m" id="c-virar">Virar</button></section>`;
    return `<h1>Meu cadastro</h1><p class="tp-sub">Sua carteirinha e os dados que a Secretaria tem de você.</p>
      <div class="per so-m"><button data-ct2="cart" aria-pressed="${ST.ctab2 === 'cart'}">Carteirinha</button><button data-ct2="ficha" aria-pressed="${ST.ctab2 === 'ficha'}">Minha ficha</button></div>
      <div class="cgrid t-${ST.ctab2}">${cart}${ficha}</div>`;
  }
  async function ligarCad() {
    document.querySelectorAll('[data-ct2]').forEach(b => { b.onclick = () => { ST.ctab2 = b.dataset.ct2; render(); }; });
    $('#c-virar').onclick = () => { ST.verso = !ST.verso; $('#c-cart').classList.toggle('verso', ST.verso); };
    const al = $('#c-alt'); if (al) al.onclick = () => { ST.form = 'alt'; ST.msg = ''; ir('solic'); };
    try {
      if (!ST.cart) { const r = await api('publico.carteirinha', { token: ses.get().t }), logo = await CARTAO.logo('logo.png'), a = r.associado, c = r.carteirinha;
        ST.cart = { tipo: c.tipo || '', nome: a.nome, matricula: a.matricula, funcao: c.funcao, categoria: c.categoria, validade: c.validade, cpf: a.cpf, rg: a.rg, dataIngresso: a.dataIngresso, foto: a.foto, codigo: c.codigo,
          assoc: r.config.assoc, presidenteNome: r.config.presidenteNome, assinatura: r.assinatura, textoVerso: r.config.textoVerso, siteUrl: r.config.siteUrl, logo, selo: null }; }
      const el = $('#c-cart'); if (el) el.innerHTML = `<div class="fr">${CARTAO.frente(ST.cart)}</div><div class="vs">${CARTAO.verso(ST.cart)}</div><div class="selos"><span class="selo ok">Válida até ${fmtD(ST.cart.validade)}</span>${ST.cart.tipo === 'Provisória' ? '<span class="selo warn">Provisória</span>' : ''}<span class="selo sea">Associado ativo</span></div>`;
    } catch (e) { const el = $('#c-cart'); if (el) el.innerHTML = `<p class="nota" style="color:var(--bad)">${esc(e.message)}</p>`; }
  }
  document.addEventListener('contextmenu', e => { if (e.target.closest('#app')) e.preventDefault(); });
  function iniciar() {
    const q = new URLSearchParams(location.search), t = q.get('t'), c = q.get('c');
    if (t) { ses.set(t, ''); history.replaceState(null, '', 'transparencia.html'); return carregar(); }
    if (c) { ses.ultimo = c; return ses.get() && ses.get().c === c ? carregar() : entradaQR(c); }
    const s = ses.get(); if (s) { if (s.c) ses.ultimo = s.c; return carregar(); }
    aviso('SEM', 'Abra o Portal da Transparência pelo link pessoal ou pelo QR Code da sua carteirinha.');
  }
  iniciar();
})();
</script>
</body>
</html>
